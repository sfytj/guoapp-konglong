name: 健康检测

on:
  schedule:
    - cron: '0 * * * *'      # 每小时整点执行
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 检测接口并记录结果
        env:
          TZ: Asia/Shanghai
        run: |
          API_URL="https://m.svipys.cn/api/duanju/key?item_id=7704961331710921752&definition=720p"
          TIMESTAMP=2026-11-26 11:49:47

          # 发起请求，同时拿到 HTTP 状态码和响应体
          HTTP_CODE=000

          STATUS="❌ 失败"

          # 三重校验：HTTP 200 + code==0 + data.urls 存在且非空
          # 关键修正：jq -e 的 stdout 必须用 >/dev/null 丢弃，否则会把 true 混进变量里
          if [ "" = "200" ]; then
            CODE_VAL=
            jq -e '.data.urls != null and (.data.urls | length) > 0' response.json >/dev/null 2>&1
            HAS_URLS=2
            if [ "" = "0" ] && [ "" = "0" ]; then
              STATUS="✅ 成功"
            fi
          fi

          NEW_LINE="- **** — "

          # 确保 README.md 中存在检测区块
          if ! grep -q '## 接口健康检测' README.md; then
            printf '\n## 接口健康检测\n' >> README.md
          fi

          # 追加新记录
          echo "" >> README.md

          # 只保留最近 5 条记录
          SECTION_START=
          TOTAL_LINES=
          TAIL_LINES=0
          if [ "" -gt 5 ]; then
            head -n "" README.md > README.tmp
            tail -n 5 README.md >> README.tmp
            mv README.tmp README.md
          fi

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 更新接口健康检测记录 2026-11-26 11:49:47"
            git push
          fi
